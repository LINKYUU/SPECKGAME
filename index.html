        // FUNGSI CEK DAN AMBIL JUMLAH SISA KUOTA HARI INI
        function getSearchQuotaData() {
            const today = new Date().toISOString().split('T')[0]; // Format: YYYY-MM-DD
            let data = localStorage.getItem('linkyu_search_quota');
            
            if (!data) {
                return { date: today, count: 0 };
            }
            
            let parsed = JSON.parse(data);
            // Jika hari sudah berganti, reset hitungan jadi 0
            if (parsed.date !== today) {
                return { date: today, count: 0 };
            }
            return parsed;
        }

        // FUNGSI UPDATE TAMPILAN SISA KUOTA DI TOMBOL
        function updateQuotaUI() {
            const quota = getSearchQuotaData();
            const remaining = MAX_DAILY_SEARCH - quota.count;
            const btn = document.getElementById('btnCheck');
            const info = document.getElementById('quotaInfo');

            if (remaining <= 0) {
                btn.disabled = true;
                btn.innerText = "Kuota Harian Habis ❌";
                info.innerText = "Sisa kuota: 0x cek. Batas 5x per hari. Silakan coba lagi besok!";
                info.className = "text-center text-xs text-red-400 mt-2 font-mono";
            } else {
                info.className = "text-center text-xs text-gray-400 mt-2 font-mono";
            }
        }

        function suggestLaptopClean() {
            const input = document.getElementById('laptopNameInput').value.toLowerCase();
            const datalist = document.getElementById('laptopSuggestions');
            datalist.innerHTML = "";
            if (input.trim().length < 1) return;
            const filtered = cleanLaptopDatabase.filter(item => item.toLowerCase().includes(input));
            filtered.slice(0, 15).forEach(laptop => {
                const option = document.createElement('option');
                option.value = laptop;
                datalist.appendChild(option);
            });
        }

        let gameDebounceTimer;
        function suggestGameRAWGOnly() {
            clearTimeout(gameDebounceTimer);
            const query = document.getElementById('gameInput').value;
            const datalist = document.getElementById('gameSuggestions');
            if (query.trim().length < 2) {
                datalist.innerHTML = "";
                return;
            }
            gameDebounceTimer = setTimeout(async () => {
                try {
                    const rawgUrl = `https://api.rawg.io/api/games?key=${RAWG_API_KEY}&search=${encodeURIComponent(query)}&page_size=12`;
                    const response = await fetch(rawgUrl);
                    const data = await response.json();
                    datalist.innerHTML = "";
                    if (data && data.results) {
                        data.results.forEach(game => {
                            const option = document.createElement('option');
                            option.value = game.name;
                            datalist.appendChild(option);
                        });
                    }
                } catch (error) {
                    console.error("Gagal menarik data dari RAWG API:", error);
                }
            }, 350);
        }

        async function checkCompatibilityWithGemini() {
            // Validasi Kuota Terlebih Dahulu sebelum eksekusi API
            const quota = getSearchQuotaData();
            if (quota.count >= MAX_DAILY_SEARCH) {
                alert("Batas penggunaan sistem harian Anda telah mencapai limit (Maks 5x pencarian sehari). Silakan coba lagi besok!");
                updateQuotaUI();
                return;
            }

            const laptopName = document.getElementById('laptopNameInput').value;
            const userRam = document.getElementById('laptopRam').value;
            const gameSelected = document.getElementById('gameInput').value;
            const btn = document.getElementById('btnCheck');

            if (!laptopName || !gameSelected) {
                alert("Harap isi nama laptop dan judul game terlebih dahulu!");
                return;
            }

            btn.innerText = "Mencari data spesifikasi game...";
            btn.disabled = true;

            let gameMinSpecs = "Tidak ada data spesifikasi minimum spesifik.";
            let gameRecSpecs = "Tidak ada data spesifikasi rekomendasi spesifik.";

            try {
                const rawgSearchUrl = `https://api.rawg.io/api/games?key=${RAWG_API_KEY}&search=${encodeURIComponent(gameSelected)}&page_size=1`;
                const rawgResp = await fetch(rawgSearchUrl);
                const rawgData = await rawgResp.json();
                
                if (rawgData && rawgData.results && rawgData.results.length > 0) {
                    const platformsData = rawgData.results[0].platforms;
                    if (platformsData) {
                        const pcPlatform = platformsData.find(p => p.platform.slug === "pc");
                        if (pcPlatform && pcPlatform.requirements_en) {
                            if (pcPlatform.requirements_en.minimum) gameMinSpecs = pcPlatform.requirements_en.minimum;
                            if (pcPlatform.requirements_en.recomended) gameRecSpecs = pcPlatform.requirements_en.recomended;
                        }
                    }
                }
            } catch (err) {
                console.log("Gagal menarik spek asli via RAWG, lanjut memakai pencarian mandiri AI...", err);
            }

            btn.innerText = " Sedang Menganalisis DI LINK.YU...";

          let bagianSyaratGame = "";
            
            if (gameMinSpecs.includes("Tidak ada data") || gameMinSpecs.trim() === "") {
                // Jika RAWG kosong, paksa AI pakai otak internalnya secara mutlak
                bagianSyaratGame = `[PERINTAH UTMA]
Data spesifikasi dari API kosong. Kamu WAJIB menggunakan database pengetahuan internal kamu sendiri untuk menganalisis spesifikasi sistem, vram, dan RAM yang dibutuhkan oleh game "${gameSelected}".`;
            } else {
                // Jika RAWG ada isinya, masukkan ke prompt
                bagianSyaratGame = `[TEKS MENTAH SYARAT GAME DARI API]
Teks Minimum: "${gameMinSpecs.replace(/"/g, "'")}"
Teks Rekomendasi: "${gameRecSpecs.replace(/"/g, "'")}"`;
            }

            // PROMPT FINAL YANG DIKIRIM
            const promptAI = `Tugas: Analisis kecocokan hardware laptop untuk menjalankan game secara akurat.

[HARDWARE LAPTOP PEMBELI]
Nama Laptop: ${laptopName}
RAM Laptop: ${userRam} GB

${bagianSyaratGame}

Aturan Analisis:
1. Identifikasi VGA/GPU asli yang tertanam pada laptop "${laptopName}" (Contoh: jika tertulis gtx 980, berarti VGA-nya NVIDIA GeForce GTX 980).
2. Nilai apakah hardware tersebut (CPU & VGA) kuat, lag, atau tidak bisa untuk game "${gameSelected}" rilisan terbaru. JANGAN PERNAH berasumsi semua game pasti lancar jika data API kosong!

Aturan Kategori Status Hasil:
- "KUAT": Jika spesifikasi laptop di atas syarat game dan dijamin lancar fps tinggi.
- "LAG": Jika laptop mepet syarat minimum, atau komponennya seri tua (seperti GTX 980 atau i3 lama) yang dipaksa menjalankan game berat/terbaru sehingga pasti patah-patah/drop FPS.
- "TIDAK BISA": Jika VGA/RAM berada di bawah syarat minimum mutlak game.

Jawab kaku dalam format JSON saja tanpa markdown/bintang/backtick:
{"status": "KUAT atau LAG atau TIDAK BISA", "vga": "Sebutkan hanya tipe VGA laptop ini secara singkat"}`;
            
            try {
                const response = await fetch(`${BASE_URL.replace(/\/$/, "")}/chat/completions`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: MODEL_NAME,
                        messages: [{ role: "user", content: promptAI }],
                        temperature: 0.1
                    })
                });

                const data = await response.json();
                let aiText = data.choices[0].message.content.trim();

                aiText = aiText.replace(/```json/g, "").replace(/```/g, "").trim();
                
               const result = JSON.parse(aiText);
                const statusHasil = result.status.toUpperCase();
                const vgaLaptop = result.vga || "Tidak terdeteksi"; // Mengambil nama VGA dari AI

                document.getElementById('resultContainer').classList.remove('hidden');
                document.getElementById('resLaptop').innerText = laptopName;
                document.getElementById('resGame').innerText = gameSelected;
                
                // Teks rincian otomatis diisi secara hemat tanpa kalimat AI yang panjang
                document.getElementById('aiAnalysisResult').innerText = `VGA Terdeteksi: ${vgaLaptop}\nStatus Kompatibilitas: Laptop ini masuk dalam kategori ${statusHasil} untuk menjalankan game ${gameSelected}.`;

                const statusBadge = document.getElementById('statusBadge');
                
                // LOGIKA WARNA BADGE (Tetap sama seperti kodinganmu)
                if (statusHasil.includes("KUAT") && !statusHasil.includes("TIDAK") && !statusHasil.includes("LAG")) {
                    statusBadge.innerText = "Kuat / Lancar Jaya! 🔥";
                    statusBadge.className = "text-center py-4 rounded-xl text-xl font-black uppercase tracking-wider mb-6 bg-green-950/80 text-green-400 border border-green-600/60 shadow-lg shadow-green-950/20";
                } else if (statusHasil.includes("LAG")) {
                    statusBadge.innerText = "Bisa Main Tapi Lag  Patah-Patah ⚠️\nGAK TANGGUNG JAWAB JIKA TIDAK BISA MAIN";
                    statusBadge.className = "text-center py-4 rounded-xl text-xl font-black uppercase tracking-wider mb-6 bg-amber-950/80 text-amber-400 border border-amber-600/60 shadow-lg shadow-amber-950/20 whitespace-pre-line";
                } else {
                    statusBadge.innerText = "Tidak Bisa / Spesifikasi Kurang ❌";
                    statusBadge.className = "text-center py-4 rounded-xl text-xl font-black uppercase tracking-wider mb-6 bg-red-950/80 text-red-400 border border-red-600/60 shadow-lg shadow-red-950/20";
                }

                // KETIKA BERHASIL MENDAPATKAN HASIL DARI GEMINI, TAMBAHKAN HITUNGAN KUOTA
                const currentQuota = getSearchQuotaData();
                currentQuota.count += 1;
                localStorage.setItem('linkyu_search_quota', JSON.stringify(currentQuota));

            } catch (error) {
                console.error(error);
                alert("Gagal memproses data atau format AI tidak sesuai. Silakan klik sekali lagi.");
            } finally {
                btn.disabled = false;
                updateQuotaUI(); // Perbarui sisa kuota setelah request selesai
            }
        }

        // JALANKAN CEK KUOTA SAAT HALAMAN PERTAMA KALI DI-LOAD
        window.onload = function() {
            updateQuotaUI();
        };
    </script>
</body>
</html>
