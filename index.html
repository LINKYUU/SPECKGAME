<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINK.YU</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen selection:bg-indigo-500 selection:text-white">

    <div class="max-w-4xl mx-auto px-4 py-10">
        <header class="text-center mb-10">
            <div class="inline-block bg-indigo-600/10 border border-indigo-500/20 px-4 py-1.5 rounded-full text-indigo-400 text-xs font-semibold uppercase tracking-wider mb-3 shadow-sm">
                LINK.YU Catalog System
            </div>
            <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 bg-clip-text text-transparent mb-4 text-center whitespace-pre-line leading-relaxed">
                WAJIB PESAN GAME DI LINK.YU
                SELAIN ITU BUKAN TOKO SAYA
                WA : 08 777 26 77776
            </h1>
            <p class="text-gray-400 text-sm md:text-base">
                Ketik Sesuai Speck kamu atau Tipe Laptop Kamu dan Nama game kamu 
            </p>
        </header>

        <div class="bg-gray-800 p-6 rounded-2xl shadow-xl border border-gray-700/70 mb-8 backdrop-blur-sm">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                
                <div class="space-y-4">
                    <h3 class="text-lg font-semibold text-indigo-400 border-b border-gray-700 pb-2 flex items-center gap-2">
                        <span>💻</span> 1. Spesifikasi Laptop
                    </h3>
                    
                    <div>
                        <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-1">Nama / Tipe Laptop Lengkap</label>
                        <input type="text" id="laptopNameInput" list="laptopSuggestions" oninput="suggestLaptopClean()" placeholder="Ketik merk/seri laptop pembeli..." class="w-full bg-gray-700 border border-gray-600 rounded-xl px-4 py-2.5 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition duration-150">
                        <datalist id="laptopSuggestions"></datalist>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-1">Kapasitas RAM Laptop</label>
                        <select id="laptopRam" class="w-full bg-gray-700 border border-gray-600 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition duration-150">
                            <option value="2">2 GB</option>
                            <option value="4">4 GB</option>
                            <option value="8" selected>8 GB</option>
                            <option value="12">12 GB</option>
                            <option value="16">16 GB</option>
                            <option value="24">24 GB</option>
                            <option value="32">32 GB</option>
                            <option value="64">64 GB</option>
                            <option value="128">128 GB</option>
                        </select>
                    </div>
                </div>

                <div class="flex flex-col justify-between">
                    <div class="space-y-4">
                        <h3 class="text-lg font-semibold text-indigo-400 border-b border-gray-700 pb-2 flex items-center gap-2">
                            <span>🎮</span> 2. Game yang Dicari
                        </h3>
                        <div>
                            <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-1">Cari Judul Game PC </label>
                            <input type="text" id="gameInput" list="gameSuggestions" oninput="suggestGameRAWGOnly()" placeholder="Ketik game, misal: naruto, gta v, forza..." class="w-full bg-gray-700 border border-gray-600 rounded-xl px-4 py-2.5 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition duration-150">
                            <datalist id="gameSuggestions"></datalist>
                        </div>
                    </div>

                    <div class="mt-6 md:mt-0">
                        <button onclick="mintaAnalisisNodeJS()" id="btnCheck" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold py-3.5 rounded-xl transition duration-200 shadow-lg shadow-indigo-900/30 active:scale-[0.99] flex items-center justify-center gap-2">
                            <span id="btnIcon">🚀</span> <span id="btnText">Cek Kompatibilitas Otomatis</span>
                        </button>
                    </div>
                </div>

            </div>
        </div>
        
        <div id="resultContainer" class="hidden bg-gray-800 p-6 rounded-2xl shadow-xl border border-indigo-500/30 backdrop-blur-sm transition-all duration-350">
            <h2 class="text-xl font-bold mb-3 text-indigo-400 flex items-center gap-2">
                <span>🤖</span> Hasil Analisis Spesifikasi Toko LINK.YU
            </h2>
            <div id="aiResultText" class="text-gray-200 text-sm md:text-base leading-relaxed whitespace-pre-line bg-gray-950/40 p-5 rounded-xl border border-gray-700/50 font-sans">
                </div>
        </div>
    </div>

    <script>
        const RAWG_API_KEY = "158b3858daed4d67af02a839d14ba445";

        const cleanLaptopDatabase = [
            "Lenovo Legion Go Z1 Extreme", "ASUS ROG Ally Z1", "ASUS ROG Ally Z1 Extreme", "ASUS ROG Ally X",
            "Valve Steam Deck LCD", "Valve Steam Deck OLED", "MSI Claw A1M Ultra 5", "MSI Claw A1M Ultra 7", "MSI Claw 8 AI Plus",
            "AYANEO 2", "AYANEO Geek", "AYANEO Air Pro", "AYANEO Kun", "OneXPlayer 2", "GPD Win 4",
            "ASUS ROG Flow Z13 GZ301", "ASUS ROG Flow Z13 ACRNM", "ASUS ROG Flow X13 GV301", "ASUS ROG Flow X13 GV302", "ASUS ROG Flow X16 GV601"
        ];

        function suggestLaptopClean() {
            const input = document.getElementById('laptopNameInput').value.toLowerCase();
            const datalist = document.getElementById('laptopSuggestions');
            datalist.innerHTML = "";
            if (input.trim().length < 1) return;
            const filtered = cleanLaptopDatabase.filter(item => item.toLowerCase().includes(input));
            filtered.slice(0, 15).forEach(laptop => {
                const option = document.createElement('option');
                option.value = laptop;
                datalist.appendChild(option);
            });
        }

        let gameDebounceTimer;
        function suggestGameRAWGOnly() {
            clearTimeout(gameDebounceTimer);
            const query = document.getElementById('gameInput').value;
            const datalist = document.getElementById('gameSuggestions');
            if (query.trim().length < 2) {
                datalist.innerHTML = "";
                return;
            }
            gameDebounceTimer = setTimeout(async () => {
                try {
                    const rawgUrl = `https://api.rawg.io/api/games?key=${RAWG_API_KEY}&search=${encodeURIComponent(query)}&page_size=12`;
                    const response = await fetch(rawgUrl);
                    const data = await response.json();
                    datalist.innerHTML = "";
                    if (data && data.results) {
                        data.results.forEach(game => {
                            const option = document.createElement('option');
                            option.value = game.name;
                            datalist.appendChild(option);
                        });
                    }
                } catch (error) {
                    console.error("Gagal menarik data dari RAWG API:", error);
                }
            }, 350);
        }

        // ==================== FUNGSI JEMBATAN TEMBEK KE RDP VIA NGROK ====================
        async function mintaAnalisisNodeJS() {
            const laptop = document.getElementById('laptopNameInput').value;
            const ram = document.getElementById('laptopRam').value;
            const game = document.getElementById('gameInput').value;

            if (!laptop || !game) {
                alert("Harap isi nama laptop dan judul game terlebih dahulu!");
                return;
            }

            const btn = document.getElementById('btnCheck');
            const btnIcon = document.getElementById('btnIcon');
            const btnText = document.getElementById('btnText');
            const container = document.getElementById('resultContainer');
            const content = document.getElementById('aiResultText');

            btn.disabled = true;
            btnIcon.innerText = "⏳";
            btnText.innerText = "Node.js Membaca Data AI...";
            
            container.classList.remove('hidden');
            content.innerHTML = `<span class="text-gray-400 italic animate-pulse">Menghubungkan ke server RDP, mohon tunggu...</span>`;

            try {
                // !!! PENTING: GANTI UTUH ALAMAT DI BAWAH INI DENGAN LINK HTTPS DARI NGROK RDP KAMU !!!
                const linkNgrokRdp = "https://spied-radar-nuzzle.ngrok-free.dev";
                
                const respon = await fetch(`${linkNgrokRdp}/api/cek-spek?laptop=${encodeURIComponent(laptop)}&ram=${ram}&game=${encodeURIComponent(game)}`);
                const data = await respon.json();

                if (data && data.hasil) {
                    let formattedText = data.hasil.replace(/\*\*(.*?)\*\*/g, '<strong class="text-indigo-400">$1</strong>');
                    content.innerHTML = formattedText;
                } else {
                    content.innerHTML = `<span class="text-red-400">Gagal mengolah data dari server backend RDP.</span>`;
                }
            } catch (error) {
                content.innerHTML = `<span class="text-red-400">Gagal terhubung ke Node.js RDP! Pastikan server.js dan ngrok di RDP sudah berjalan aktif.</span>`;
            } finally {
                btn.disabled = false;
                btnIcon.innerText = "🚀";
                btnText.innerText = "Cek Kompatibilitas Otomatis";
                container.scrollIntoView({ behavior: 'smooth' });
            }
        }
    </script>
</body>
</html>
