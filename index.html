<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINK.YU CATALOG SYSTEM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar untuk hasil dropdown RAWG */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1c2033; }
        ::-webkit-scrollbar-thumb { background: #3b405a; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #4f5574; }
    </style>
</head>
<body class="bg-[#11131e] text-white font-sans min-h-screen flex flex-col items-center pt-12 px-4">

    <div class="px-5 py-1.5 rounded-full border border-indigo-900/50 bg-indigo-900/20 text-indigo-300 text-xs font-bold tracking-wide mb-8 shadow-[0_0_15px_rgba(49,46,129,0.3)]">
        LINK.YU CATALOG SYSTEM
    </div>

    <h1 class="text-center text-4xl md:text-5xl font-black leading-tight mb-4 tracking-tight">
        <span class="text-[#b19cd9] drop-shadow-md">WAJIB PESAN GAME DI LINK.YU</span><br>
        <span class="text-[#d8a8eb] drop-shadow-md">WA : 08 777 26 77776</span>
    </h1>
    

    <div class="bg-[#1e2235] border border-[#2a2f45] rounded-[1.5rem] p-8 w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 gap-8 shadow-2xl">
        
        <div class="space-y-5">
            <h2 class="text-blue-400 font-bold flex items-center gap-2 text-lg">
                💻 1. Spesifikasi Laptop
            </h2>
            
            <div>
                <label class="block text-[11px] font-bold text-gray-400 tracking-wider mb-2">NAMA / TIPE LAPTOP LENGKAP</label>
                <input id="laptopNameInput" type="text" class="w-full bg-[#2a2f45] border border-transparent rounded-xl p-3.5 text-sm text-gray-200 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition placeholder-gray-500" placeholder="Masukan laptop/Pc Dengan Lengkap !
            <div>
                <label class="block text-[11px] font-bold text-gray-400 tracking-wider mb-2">KAPASITAS RAM LAPTOP</label>
                <select id="laptopRam" class="w-full bg-[#2a2f45] border border-transparent rounded-xl p-3.5 text-sm text-gray-200 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition appearance-none cursor-pointer">
                    <option value="4">4 GB</option>
                    <option value="8" selected>8 GB</option>
                    <option value="16">8 GB</option>
                    <option value="32">32 GB</option>
                    <option value="64">64 GB</option>
                </select>
            </div>
        </div>

        <div class="space-y-5">
            <h2 class="text-[#b19cd9] font-bold flex items-center gap-2 text-lg">
                🎮 2. Game yang Dicari
            </h2>
            
            <div class="relative">
                <label class="block text-[11px] font-bold text-gray-400 tracking-wider mb-2">CARI JUDUL GAME PC</label>
                <input id="gameInput" type="text" autocomplete="off" class="w-full bg-[#2a2f45] border border-transparent rounded-xl p-3.5 text-sm text-gray-200 focus:outline-none focus:border-[#b19cd9] focus:ring-1 focus:ring-[#b19cd9] transition placeholder-gray-500" placeholder="Ketik game, misal: naruto, gta v, forza...">
                
                <ul id="rawgDropdown" class="absolute z-50 w-full bg-[#2a2f45] border border-[#3b405a] rounded-xl mt-2 hidden max-h-56 overflow-y-auto shadow-2xl">
                </ul>
            </div>

            <div class="pt-6">
                <button onclick="checkCompatibilityOnGoogleIndo()" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 transition-all duration-300 py-3.5 rounded-xl font-bold text-white shadow-[0_0_20px_rgba(139,92,246,0.3)] flex justify-center items-center gap-2">
                    🚀 Cek Kompatibilitas Otomatis
                </button>
            </div>
        </div>
    </div>

    <p class="text-xs text-gray-600 mt-6 mb-10">*Sistem akan otomatis membuka Google Search dengan kalimat pencarian bahasa Indonesia secara instan.</p>

    <div id="hasilBox" class="w-full max-w-4xl pb-20"></div>

    <script>
        // ==========================================
        // 1. INTEGRASI API RAWG
        // ==========================================
        const rawgApiKey = "158b3858daed4d67af02a839d14ba445"; // Isi API Key RAWG Anda
        const gameInput = document.getElementById('gameInput');
        const rawgDropdown = document.getElementById('rawgDropdown');
        let debounceTimer;

        gameInput.addEventListener('input', function() {
            clearTimeout(debounceTimer);
            const query = this.value.trim();

            if (query.length < 3) {
                rawgDropdown.classList.add('hidden');
                return;
            }

            rawgDropdown.innerHTML = `<li class="p-4 text-sm text-gray-400 text-center">Mencari di RAWG...</li>`;
            rawgDropdown.classList.remove('hidden');

            debounceTimer = setTimeout(async () => {
                try {
                    if(rawgApiKey === "MASUKKAN_API_KEY_RAWG_ANDA_DISINI") {
                        rawgDropdown.innerHTML = `<li class="p-4 text-sm text-red-400 text-center">API Key RAWG belum diisi di kode.</li>`;
                        return;
                    }
                    const response = await fetch(`https://api.rawg.io/api/games?key=${rawgApiKey}&search=${query}&page_size=6`);
                    const data = await response.json();
                    rawgDropdown.innerHTML = ''; 

                    if (data.results && data.results.length > 0) {
                        data.results.forEach(game => {
                            const li = document.createElement('li');
                            li.className = "p-2 hover:bg-[#3b405a] cursor-pointer flex items-center gap-3 transition border-b border-[#3b405a]/50 last:border-0";
                            const imageSrc = game.background_image ? game.background_image : 'https://via.placeholder.com/40x40?text=No+Img';
                            
                            li.innerHTML = `
                                <img src="${imageSrc}" class="w-10 h-10 object-cover rounded-md shadow">
                                <div>
                                    <div class="text-sm font-semibold text-gray-200">${game.name}</div>
                                    <div class="text-[10px] text-gray-400 uppercase">${game.released ? game.released.substring(0,4) : 'N/A'}</div>
                                </div>
                            `;
                            li.onclick = () => {
                                gameInput.value = game.name;
                                rawgDropdown.classList.add('hidden');
                            };
                            rawgDropdown.appendChild(li);
                        });
                    } else {
                        rawgDropdown.innerHTML = `<li class="p-4 text-sm text-gray-400 text-center">Game tidak ditemukan</li>`;
                    }
                } catch (error) {
                    rawgDropdown.innerHTML = `<li class="p-4 text-sm text-red-400 text-center">Gagal menyambung ke server</li>`;
                }
            }, 600); 
        });

        document.addEventListener('click', function(e) {
            if (!gameInput.contains(e.target) && !rawgDropdown.contains(e.target)) {
                rawgDropdown.classList.add('hidden');
            }
        });

        // ==========================================
        // 2. KODE ANALISIS & BUKA TAB BARU (AI SUMMARY)
        // ==========================================
       // ==========================================
        // 2. BUKA PENCARIAN GOOGLE ASLI DI TAB BARU
        // ==========================================
        function checkCompatibilityOnGoogleIndo() {
            const laptopName = document.getElementById('laptopNameInput').value;
            const userRam = document.getElementById('laptopRam').value;
            const gameSelected = document.getElementById('gameInput').value;

            if (!laptopName || !gameSelected) {
                alert("Harap isi nama laptop dan judul game terlebih dahulu!");
                return;
            }

            // Tampilkan Loading di halaman utama
            let hasilBox = document.getElementById("hasilBox");
            hasilBox.className = "mt-6 bg-[#1e2235] p-6 rounded-[1.5rem] border border-[#2a2f45] shadow-2xl mx-auto w-full";
            hasilBox.innerHTML = `
                <div class="flex items-center justify-center gap-3 text-[#b19cd9]">
                    <svg class="animate-spin h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    <span class="font-bold">Membuka Google Search...</span>
                </div>
            `;
            hasilBox.scrollIntoView({ behavior: "smooth" });

            // Delay sebentar lalu alihkan ke Google Search
            setTimeout(() => {
                hasilBox.innerHTML = `<div class="text-center text-green-400 font-bold">✅ Berhasil dialihkan ke tab Google.</div>`;
                
                // Susun kalimat pencarian agar relevan dan spesifik
                const keywordPencarian = `${laptopName} RAM ${userRam}GB kuat main game ${gameSelected} jawab hanya kuat atau tidak kuat secara singkat`;
                
                // Ubah teks menjadi format URL yang valid (encode)
                const googleUrl = `https://www.google.com/search?q=${encodeURIComponent(keywordPencarian)}`;
                
                // Buka link Google di Tab Baru
                window.open(googleUrl, "_blank");
            }, 800);
        }
    </script>
</body>
</html>
